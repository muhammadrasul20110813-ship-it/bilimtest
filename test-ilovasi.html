<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2140;--mut:#6b7392;--ac:#5b5bf0;--ok:#16a34a;--no:#dc2626;--bd:#e3e7f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1224;--card:#1a1f3a;--tx:#eef0ff;--mut:#9aa3c7;--bd:#2a3158}}
:root[data-theme=dark]{--bg:#0f1224;--card:#1a1f3a;--tx:#eef0ff;--mut:#9aa3c7;--bd:#2a3158}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#5b5bf0,#a855f7);color:#fff;padding:22px 16px 40px;text-align:center}
header h1{margin:0;font-size:28px}header p{margin:6px 0 0;opacity:.9}
main{max-width:980px;margin:-24px auto 40px;padding:0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sub{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 10px;text-align:center;cursor:pointer;transition:.2s;border-top:5px solid hsl(var(--h),70%,55%)}
.sub:hover{transform:translateY(-4px);box-shadow:0 10px 24px hsla(var(--h),70%,50%,.25)}
.sub b{display:block;margin-top:6px;font-size:15px}.sub .e{font-size:34px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h2{margin:0;font-size:22px;flex:1}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:var(--ac);color:#fff;text-decoration:none;display:inline-block}
.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.topic{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;flex-wrap:wrap}
.topic .n{flex:1;min-width:150px}.topic small{color:var(--mut);display:block;margin-top:2px}
.vid{background:#ef4444}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0 18px}.bar i{display:block;height:100%;background:var(--ac);transition:.3s}
.q{font-size:20px;font-weight:600;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;background:var(--bg);color:var(--tx);border:2px solid var(--bd);padding:13px 14px}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.15)}.opt.no{border-color:var(--no);background:rgba(220,38,38,.15)}
.score{font-size:56px;font-weight:800;text-align:center;margin:10px 0;color:var(--ac)}
.c{text-align:center}.mut{color:var(--mut)}
</style></head><body>

['Darajaga ko’tarish',g=>{let x=R(4)+1,y=R(2)+1;return[`${x}^${y+1} = ?`,x**(y+1)]}],
['Diskriminant',g=>{let a=R(4),b=R(9),c=R(4);return[`${a}x² + ${b}x + ${c} = 0 tenglamaning diskriminanti?`,b*b-4*a*c]}],
['Kvadrat tenglama ildizi',g=>{let p=R(9),r=R(9);return[`x² − ${p+r}x + ${p*r} = 0 tenglamaning katta ildizi?`,Math.max(p,r)]}],
['Arifmetik progressiya n-hadi',g=>{let a=R(10),d=R(5),n=R(8)+3;return[`a₁ = ${a}, d = ${d} bo’lsa, a${n} = ?`,a+(n-1)*d]}],
['Arifmetik progressiya yig’indisi',g=>{let a=R(10),d=R(5),n=R(8)+2;return[`a₁ = ${a}, d = ${d} bo’lsa, dastlabki ${n} hadi yig’indisi?`,n*(2*a+(n-1)*d)/2]}],
['Geometrik progressiya',g=>{let b=R(4),q=R(2)+1,n=R(3)+2;return[`b₁ = ${b}, q = ${q} bo’lsa, b${n} = ?`,b*q**(n-1)]}],
['Faktorial',g=>{let n=R(6)+1;return[`${n}! = ?`,[...Array(n).keys()].reduce((p,i)=>p*(i+1),1)]}],
['Kombinatsiya',g=>{let n=R(8)+2;return[`${n} kishidan 2 kishini necha usul bilan tanlash mumkin?`,n*(n-1)/2]}],
['Funksiya qiymati',g=>{let a=R(5),b=R(9),x=R(9);return[`f(x) = ${a}x + ${b} bo’lsa, f(${x}) = ?`,a*x+b]}],
['Hosila qiymati',g=>{let a=R(5),b=R(9),x=R(5);return[`f(x) = ${a}x² + ${b}x bo’lsa, f’(${x}) = ?`,2*a*x+b]}],
['Aniq integral',g=>{let k=R(6);return[`∫ 2x dx (0 dan ${k} gacha) = ?`,k*k]}],
['Logarifm hisoblash',g=>{let b=pk([2,3,5]),n=R(3)+1;return[`log_${b}(${b**n}) = ?`,n]}]]);
addG('gm',[7,8,9,10,11],[
['To’rtburchak perimetri',rp],['To’rtburchak yuzi',ry],
['Uchburchakning uchinchi burchagi',g=>{let a=R(70)+10,b=R(70)+10;return[`Uchburchakning ikki burchagi ${a}° va ${b}° bo’lsa, uchinchisi?`,180-a-b]}],
['Pifagor: gipotenuza',g=>{let[t,u,v]=pk(TR);return[`Katetlari ${t} va ${u} bo’lgan to’g’ri burchakli uchburchak gipotenuzasi?`,v]}],
['Pifagor: katet',g=>{let[t,u,v]=pk(TR);return[`Gipotenuza ${v}, bir katet ${t} bo’lsa, ikkinchi katet?`,u]}],
['Aylana uzunligi (π≈3)',g=>{let r=R(12);return[`Radiusi ${r} bo’lgan aylana uzunligi (π ≈ 3 deb oling)?`,6*r]}],
['Doira yuzi (π≈3)',g=>{let r=R(12);return[`Radiusi ${r} bo’lgan doira yuzi (π ≈ 3 deb oling)?`,3*r*r]}],
['Kub hajmi',g=>{let a=R(9)+1;return[`Qirrasi ${a} bo’lgan kub hajmi?`,a**3]}],
['Parallelepiped hajmi',g=>{let a=R(9)+1,b=R(9)+1,c=R(9)+1;return[`O’lchamlari ${a}, ${b}, ${c} bo’lgan parallelepiped hajmi?`,a*b*c]}],
['Ko’pburchak burchaklari yig’indisi',g=>{let n=R(7)+3;return[`${n} burchakli qavariq ko’pburchak ichki burchaklari yig’indisi?`,(n-2)*180]}],
['Diagonallar soni',g=>{let n=R(7)+4;return[`${n} burchakli qavariq ko’pburchakning diagonallari soni?`,n*(n-3)/2]}]]);
addG('fiz',[7,8,9,10,11],[
['Tezlik (v = s/t)',g=>{let v=R(9)*5,t=R(9)+1;return[`${v*t} m yo’lni ${t} s da bosgan jismning tezligi (m/s)?`,v]}],
['Yo’l (s = v·t)',g=>{let v=R(9)*5,t=R(9)+1;return[`Tezligi ${v} m/s bo’lgan jism ${t} s da necha metr yo’l bosadi?`,v*t]}],
['Vaqt (t = s/v)',g=>{let v=R(9)*5,t=R(9)+1;return[`${v*t} m yo’lni ${v} m/s tezlik bilan necha sekundda bosadi?`,t]}],
['Nyutonning 2-qonuni',g=>{let m=R(20),a=R(9)+1;return[`Massasi ${m} kg jism ${a} m/s² tezlanish bilan harakatlanmoqda. Kuch (N)?`,m*a]}],
['Massa (m = ρV)',g=>{let r=R(9)*100,v=R(5);return[`Zichligi ${r} kg/m³, hajmi ${v} m³ bo’lgan jism massasi (kg)?`,r*v]}],
['Bosim (p = F/S)',g=>{let p=R(9)*10,s=R(9)+1;return[`${p*s} N kuch ${s} m² yuzaga ta’sir qilsa, bosim (Pa)?`,p]}],
['Mexanik ish (A = F·s)',g=>{let f=R(9)*10,s=R(9)+1;return[`${f} N kuch ta’sirida jism ${s} m yo’l bosdi. Ish (J)?`,f*s]}],
['Quvvat (N = A/t)',g=>{let n=R(9)*10,t=R(9)+1;return[`${n*t} J ish ${t} s da bajarilsa, quvvat (W)?`,n]}],
['Kuchlanish (U = I·R)',g=>{let i=R(9),r=R(9)*2;return[`Tok kuchi ${i} A, qarshilik ${r} Ω bo’lsa, kuchlanish (V)?`,i*r]}],
['Tok kuchi (I = U/R)',g=>{let i=R(9),r=R(9)*2;return[`${i*r} V kuchlanishda ${r} Ω qarshilikdan o’tuvchi tok (A)?`,i]}],
['Potensial energiya (E = mgh)',g=>{let m=R(9),h=R(9)*2;return[`${m} kg jism ${h} m balandlikda (g = 10 m/s²). Potensial energiyasi (J)?`,m*10*h]}]]);
// ===== EKRANLAR =====
function home(){st={s:null,g:null,p:null};
 $.innerHTML=`<div class="grid">${SUBJ.filter(s=>s.i!="alg"&&s.i!="gm").map(s=>`<div class="sub" style="--h:${s.h}" onclick="pick('${s.i}')"><span class="e">${s.e}</span><b>${s.n}</b></div>`).join("")}</div>
 <div class="panel" style="margin-top:16px"><b>🔍 Mavzuni qidiring</b><input id="sq" oninput="find(this.value)" placeholder="Masalan: Pifagor, Fe’l, Navoiy, Hujayra…" style="width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit"><div id="sr" style="margin-top:10px"></div></div>
 <p class="c mut">Yoki: fanni tanlang → sinfni tanlang → mavzuni tanlang</p>`}
function find(v){v=v.trim().toLowerCase().replace(/['‘`ʻʼ]/g,"’");const o=[];
 if(v.length>1)SUBJ.forEach(S=>Object.keys(S.T).forEach(g=>S.T[g].forEach((t,i)=>{if(o.length<25&&(t.toLowerCase().includes(v)||S.n.toLowerCase().includes(v)))o.push(`<div class="topic"><div class="n"><b>${t}</b><small>${S.e} ${S.n} · ${g}-sinf</small></div><button onclick="go('${S.i}',${g},${i})">Test</button></div>`)})));
 document.getElementById("sr").innerHTML=o.join("")||(v.length>1?'<p class="mut">Mavzu topilmadi.</p>':"")}
function go(i,g,t){st=(i=="alg"||i=="gm")?{s:"mat",g,p:i}:{s:i,g,p:null};start(t)}
function pick(i){st={s:i,g:null,p:null};subj()}
function grades(s){return s=="mat"?[5,6,7,8,9,10,11]:Object.keys(sub(s).T).map(Number)}
function subj(){const S=sub(st.s),gs=grades(st.s),e=eff();
 let h=`<div class="panel"><div class="top"><button class="ghost" onclick="home()">← Orqaga</button><h2>${S.e} ${S.n}</h2></div><b>Sinf:</b><div class="chips">${gs.map(g=>`<span class="chip ${st.g==g?"on":""}" onclick="st.g=${g};st.p=null;subj()">${g}-sinf</span>`).join("")}</div>`;
 if(st.s=="mat"&&st.g>=7)h+=`<b>Bo’lim:</b><div class="chips">${[["alg","Algebra"],["gm","Geometriya"]].map(([k,n])=>`<span class="chip ${st.p==k?"on":""}" onclick="st.p='${k}';subj()">${n}</span>`).join("")}</div>`;
 if(st.g&&e){const E=sub(e),ts=E.T[st.g]||[];h+=`<b>Mavzular:</b><div style="margin-top:10px">${ts.map((t,i)=>{const n=bank(e,st.g,i).length,best=store(`b:${e}:${st.g}:${i}`);
  return`<div class="topic"><div class="n"><b>${i+1}. ${t}</b><small>${isGen(e,i,st.g)?"Cheksiz savollar":(SM&&n<25?"25 ta savol":n+" ta savol")}${best?" · Eng yaxshi: "+best+"%":""}</small></div><a class="btn vid" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(E.n+" "+st.g+"-sinf "+t+" dars")}">▶ Video</a><button onclick="start(${i})">Testni boshlash</button></div>`}).join("")}</div>`}
 else h+=`<p class="mut">${st.g?"Bo’limni tanlang.":"Avval sinfni tanlang."}</p>`;
 if(st.g&&e)h+=aiBlock(e);$.innerHTML=h+"</div>"}
function start(t){if(typeof t=="string")return startAI(t);const e=eff(),E=sub(e);let qs=[];if(!isGen(e,t,st.g)&&bank(e,st.g,t).length<25&&SM)return startAI(E.T[st.g][t]);
 if(isGen(e,t,st.g))for(let i=0;i<25;i++)qs.push(gen(e,st.g,t));
 else{let p=bank(e,st.g,t);p=sh(p);if(p.length<25)p=p.concat(sh(BANK.filter(b=>b.s==e&&b.g==st.g&&b.t!=t)));if(p.length<25)p=p.concat(sh(BANK.filter(b=>b.s==e&&b.g!=st.g)));
  qs=p.slice(0,25).map(b=>({q:b.q,o:b.o,c:0}))}
 if(!qs.length){alert("Bu fan uchun savollar tez orada qo’shiladi.");return}
 qs=qs.map(x=>{const c=x.o[0];x.o=sh(x.o);x.c=x.o.indexOf(c);return x});
 qz={qs,i:0,sc:0,t,e,done:false};show()}
function show(){const{qs,i}=qz,x=qs[i];
 $.innerHTML=`<div class="panel"><div class="top"><button class="ghost" onclick="subj()">✕ Chiqish</button><h2>${i+1} / ${qs.length}</h2><b>✔ ${qz.sc}</b></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><div class="q">${x.q}</div>${x.o.map((o,k)=>`<button class="opt" onclick="ans(${k})">${o}</button>`).join("")}<div id="nx"></div></div>`}
function ans(k){if(qz.done)return;qz.done=true;const x=qz.qs[qz.i],b=document.querySelectorAll(".opt");
 b.forEach((el,j)=>{el.disabled=true;if(j==x.c)el.classList.add("ok")});
 if(k==x.c)qz.sc++;else b[k].classList.add("no");
 const last=qz.i==qz.qs.length-1;
 document.getElementById("nx").innerHTML=`<button onclick="next()" style="margin-top:6px">${last?"Natijani ko’rish":"Keyingisi →"}</button>`}
function next(){qz.done=false;qz.i++;qz.i<qz.qs.length?show():res()}
function res(){const p=Math.round(qz.sc/qz.qs.length*100),k=`b:${qz.e}:${st.g}:${qz.t}`;
 if(p>(+store(k)||0))store(k,p);
 $.innerHTML=`<div class="panel c"><h2>${p>=80?"🏆 Ajoyib!":p>=50?"👍 Yaxshi!":"💪 Yana urinib ko’ring!"}</h2><div class="score">${p}%</div><p>${qz.qs.length} ta savoldan ${qz.sc} tasi to’g’ri</p><button onclick="start(qz.t)">🔁 Qayta topshirish</button> <button class="ghost" onclick="subj()">Mavzularga qaytish</button></div>`}
const proxy={json:async p=>{const r=await fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});if(!r.ok)throw new Error('Server javob bermadi ('+r.status+'). Netlify funksiyasi va ANTHROPIC_API_KEY ni tekshiring.');return r.json()}};
let SM=proxy,cur=[];try{window.claude.use('sample').then(s=>{if(s)SM=s}).catch(()=>{})}catch(e){}
function aiBlock(e){const E=sub(e);let at=[];try{at=JSON.parse(store(`t:${e}:${st.g}`)||'[]')}catch(x){}cur=at;
 return `<div style="margin-top:18px"><div class="top"><b style="flex:1">✨ Qo’shimcha mavzular: ${at.length} ta</b><button onclick="genTopics()">${at.length?'Yana mavzu qo’shish':'📚 50 ta mavzuni yuklash'}</button></div>${at.map((t,i)=>`<div class="topic"><div class="n"><b>${t}</b><small>25 ta savol · Claude tuzadi</small></div><a class="btn vid" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(E.n+' '+st.g+'-sinf '+t+' dars')}">▶ Video</a><button onclick="start(cur[${i}])">Testni boshlash</button></div>`).join('')}${SM?'':'<p class="mut">Claude yordamidagi mavzular bu yerda hozircha ishlamayapti.</p>'}</div>`}
async function genTopics(){const e=eff(),E=sub(e),k=`t:${e}:${st.g}`;let old=[];try{old=JSON.parse(store(k)||'[]')}catch(x){}
 const have=[...E.T[st.g],...old];
 if(!SM){try{SM=await window.claude.use('sample')}catch(x){}}
 if(!SM){alert('Claude funksiyasi bu yerda mavjud emas. Ilovani claude.ai dagi havola orqali oching va ruxsat bering.');subj();return}
 $.innerHTML=`<div class="panel c"><h2>⏳ Mavzular tuzilmoqda…</h2><p class="mut">10–30 soniya kuting</p></div>`;
 try{const r=await SM.json(`O’zbekiston umumta’lim maktablari dasturi bo’yicha ${st.g}-sinf «${E.n}» fani uchun darslik mavzulari ro’yxatini tuz. Hozirgi mavzular: ${have.join('; ')}. Shularga kirmagan yana 50 ta alohida, aniq mavzu nomini ber (qisqa, o’zbek tilida; xorijiy til fanlarida mavzu nomi o’zbekcha bo’lsin). Faqat JSON massiv (satrlar ro’yxati) qaytar.`,{modelTier:'quick'});
  store(k,JSON.stringify(old.concat((Array.isArray(r)?r:Object.values(r||{}).flat()).filter(x=>typeof x=='string'&&!have.includes(x))).slice(0,150)))}catch(x){alert('Xatolik: '+(x&&x.message||x))}
 subj()}
async function startAI(name){const e=eff(),E=sub(e),k=`q:${e}:${st.g}:${name}`.slice(0,150);let qs=null;
 try{qs=JSON.parse(store(k)||'null')}catch(x){}
 if(!qs){$.innerHTML=`<div class="panel c"><h2>⏳ 25 ta savol tuzilmoqda…</h2><p class="mut">${name} · 10–30 soniya kuting</p></div>`;
  try{const r=await SM.json(`Sen O’zbekiston maktab o’qituvchisisan. ${st.g}-sinf «${E.n}» fanidan «${name}» mavzusi bo’yicha aynan 25 ta test savoli tuz. O’zbek tilida yoz (xorijiy til fanlarida kerakli tilda). Har bir savolda 4 ta variant va bitta to’g’ri javob bo’lsin. Faqat aniq, ishonchli faktlarni ishlat. Faqat JSON massiv qaytar: har bir element q (savol matni) va o (4 ta variant massivi) kalitlariga ega; o massivining birinchi elementi doim to’g’ri javob bo’lsin.`,{modelTier:'default'});
   qs=r.filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length>=4).map(x=>({q:String(x.q),o:x.o.slice(0,4).map(String),c:0}));
   if(qs.length<5)throw new Error('Savollar olinmadi, qayta urinib ko’ring');store(k,JSON.stringify(qs))}
  catch(x){$.innerHTML=`<div class="panel c"><h2>😕 Xatolik</h2><p>${x&&x.message||x}</p><button onclick="subj()">← Orqaga</button></div>`;return}}
 qs=qs.map(x=>{const c=x.o[0];x.o=sh(x.o);x.c=x.o.indexOf(c);return x});qz={qs,i:0,sc:0,t:name,e,done:false};show()}
home();
</script></body></html>
